<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Architecture: your C++ application calls a typed bytecode VM with a JIT, running C#, C and C++, and a dynamic bytecode VM, running TypeScript, JavaScript and Python. Both share one heap built on libcore.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1a1147"/>
      <stop offset="1" stop-color="#3a0d4f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#a5b4fc"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="20" fill="url(#sky)"/>
  <rect width="960" height="420" rx="20" fill="url(#grid)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- host -->
    <rect x="40" y="28" width="880" height="64" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="url(#edge)" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="480" y="56" font-size="22" font-weight="700" fill="#f1f5f9">Your C++ application</text>
    <text x="480" y="79" font-size="15" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hostClass · Class&lt;T&gt; · Context</text>

    <!-- host to engines -->
    <path d="M255 92V146" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M705 92V146" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- typed engine -->
    <rect x="40" y="148" width="430" height="124" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="255" y="178" font-size="20" font-weight="700" fill="#f1f5f9">Typed bytecode VM</text>
    <text x="255" y="201" font-size="15" fill="#94a3b8">+ arm64 / x86-64 JIT</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b1026">
      <rect x="125" y="222" width="84" height="34" rx="17" fill="#c4b5fd"/><text x="167" y="245">C#</text>
      <rect x="223" y="222" width="64" height="34" rx="17" fill="#cbd5e1"/><text x="255" y="245">C</text>
      <rect x="301" y="222" width="84" height="34" rx="17" fill="#f9a8d4"/><text x="343" y="245">C++</text>
    </g>

    <!-- dynamic engine -->
    <rect x="490" y="148" width="430" height="124" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="705" y="178" font-size="20" font-weight="700" fill="#f1f5f9">Dynamic bytecode VM</text>
    <text x="705" y="201" font-size="15" fill="#94a3b8">prototypes and closures</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b1026">
      <rect x="513" y="222" width="130" height="34" rx="17" fill="#93c5fd"/><text x="578" y="245">TypeScript</text>
      <rect x="655" y="222" width="130" height="34" rx="17" fill="#fde68a"/><text x="720" y="245">JavaScript</text>
      <rect x="797" y="222" width="100" height="34" rx="17" fill="#86efac"/><text x="847" y="245">Python</text>
    </g>

    <!-- engines to heap -->
    <path d="M255 272V314" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M705 272V314" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- heap -->
    <rect x="40" y="316" width="880" height="76" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="url(#edge)" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="480" y="345" font-size="20" font-weight="700" fill="#f1f5f9">One heap · one Value · refcounts + cycle collector</text>
    <text x="480" y="372" font-size="15" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">libcore: LocalHeap · SizeClassPool · ObjectArena · pages</text>
  </g>
</svg>
