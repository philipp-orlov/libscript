<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="libscript: one engine, six languages, zero malloc in steady state">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1a1147"/>
      <stop offset="1" stop-color="#3a0d4f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#sky)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <ellipse cx="600" cy="130" rx="460" ry="170" fill="url(#glow)"/>
  <text x="600" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="92" font-weight="700" fill="url(#title)">libscript</text>
  <text x="600" y="184" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#e2e8f0">One embeddable engine. Six languages. Zero malloc in steady state.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600" text-anchor="middle" fill="#0b1026">
    <rect x="93" y="232" width="150" height="46" rx="23" fill="#c4b5fd"/><text x="168" y="262">C#</text>
    <rect x="263" y="232" width="150" height="46" rx="23" fill="#93c5fd"/><text x="338" y="262">TypeScript</text>
    <rect x="433" y="232" width="150" height="46" rx="23" fill="#fde68a"/><text x="508" y="262">JavaScript</text>
    <rect x="603" y="232" width="150" height="46" rx="23" fill="#86efac"/><text x="678" y="262">Python</text>
    <rect x="773" y="232" width="150" height="46" rx="23" fill="#cbd5e1"/><text x="848" y="262">C</text>
    <rect x="943" y="232" width="150" height="46" rx="23" fill="#f9a8d4"/><text x="1018" y="262">C++</text>
  </g>
  <text x="600" y="322" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">C++17  ·  arm64 and x86-64 JIT  ·  sandboxed by construction  ·  no third-party dependencies</text>
</svg>
